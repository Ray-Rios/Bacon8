apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-forum-attachments
  namespace: bacon8
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: alpine:3.22
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting forum attachment migration..."
              base_dir="/app/uploads"
              
              cd "$base_dir" || exit 1
              
              # Find all user directories (UUID format)
              for user_dir in */; do
                user_id="${user_dir%/}"
                
                # Skip non-UUID directories like "public"
                if [ "$user_id" = "public" ]; then
                  continue
                fi
                
                echo "Processing user: $user_id"
                
                # Look for year/month/forum structure
                for year_dir in "$user_id"/[0-9][0-9][0-9][0-9]/; do
                  if [ ! -d "$year_dir" ]; then
                    continue
                  fi
                  
                  year=$(basename "$year_dir")
                  
                  for month_dir in "$year_dir"[0-9][0-9]/; do
                    if [ ! -d "$month_dir" ]; then
                      continue
                    fi
                    
                    month=$(basename "$month_dir")
                    
                    # Check for forum directory
                    forum_dir="$month_dir/forum"
                    if [ -d "$forum_dir" ]; then
                      echo "  Found forum directory: $year/$month/forum"
                      
                      # Process each channel directory
                      for channel_dir in "$forum_dir"/*; do
                        if [ ! -d "$channel_dir" ]; then
                          continue
                        fi
                        
                        channel_id=$(basename "$channel_dir")
                        echo "    Processing channel: $channel_id"
                        
                        # New destination for this channel
                        new_channel_dir="$base_dir/$user_id/forum/$channel_id"
                        mkdir -p "$new_channel_dir"
                        
                        # Move the entire channel directory structure
                        for item in "$channel_dir"/*; do
                          if [ ! -e "$item" ]; then
                            continue
                          fi
                          
                          item_name=$(basename "$item")
                          new_item="$new_channel_dir/$item_name"
                          
                          if [ ! -e "$new_item" ]; then
                            mv "$item" "$new_item"
                            echo "      Moved: $item_name"
                          else
                            echo "      Skipped (exists): $item_name"
                          fi
                        done
                        
                        # Remove empty channel directory
                        rmdir "$channel_dir" 2>/dev/null || true
                      done
                      
                      # Remove empty forum directory
                      rmdir "$forum_dir" 2>/dev/null || true
                    fi
                    
                    # Remove empty month directory
                    rmdir "$month_dir" 2>/dev/null || true
                  done
                  
                  # Remove empty year directory
                  rmdir "$year_dir" 2>/dev/null || true
                done
              done
              
              echo "File migration complete!"
              echo ""
              echo "Now updating database paths..."
              
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: bacon8-uploads-pvc
