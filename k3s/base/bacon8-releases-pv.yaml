# Client releases for the RaysSpaceSim launcher (content-addressed blobs).
# Kept OFF /app/uploads on purpose: that volume is served publicly by
# Plug.Static, and every byte of the client must go through
# Bacon8Web.Api.ReleasesController, which checks the signed-in player.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bacon8-releases-local-pv
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /var/lib/k8s-pvs/bacon8-releases
    type: DirectoryOrCreate
