namespace: bacon8

resources:
- ../../base
- namespace.yaml
- configmap.yaml
- secrets.yaml
- ingress.yaml
- mailhog-auth-secret.yaml

images:
- name: bacon8
  newTag: prod

patches:
- path: postgres-patch.yaml
- path: bacon8-patch.yaml
- path: service-patch.yaml